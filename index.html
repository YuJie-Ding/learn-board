<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-title" content="learn-board">
<meta name="application-name" content="learn-board">
<title>learn-board</title>
<style>
/* =====================================================================
 * style.css —— 学习看板样式（跨专题共用）
 * 呈现层，与数据无关。改数据不需要动这个文件。
 * ===================================================================== */

:root {
  --bg:        #0e1014;
  --panel:     #161920;
  --panel-2:   #1c2029;
  --panel-3:   #222732;
  --border:    #282e3a;
  --text:      #e7eaf0;
  --text-dim:  #9aa3b2;
  --text-mute: #6b7484;
  --accent:    #4f8cff;
  --accent-dim:#1e3050;

  --done:      #2ecc71;
  --done-dim:  #14361f;
  --doing:     #f5a623;
  --doing-dim: #3a2a0c;
  --todo:      #5a6270;
  --todo-dim:  #1e2229;

  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

code, pre, .mono { font-family: var(--mono); }

/* ---------- 布局 ---------- */
#app {
  display: grid;
  /* ⚠️ 必须用 minmax(0, 1fr) 而不是 1fr：
     1fr 的最小值是 auto，会被子元素（比如 pre 里的长代码行）的固有宽度撑开，
     导致手机上整页横向溢出。minmax(0, …) 把最小值强制为 0。 */
  grid-template-columns: 268px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  min-width: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.brand-title { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
.brand-sub { font-size: 12px; color: var(--text-mute); margin-top: 4px; }

/* ---------- 专题切换栏（只在"多专题打包版"里显示） ---------- */
.topic-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.topic-tab {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 5px 9px;
  font-size: 12px;
  font-family: inherit;
  line-height: 1.35;
  color: var(--text-dim);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
}
.topic-tab:hover { background: var(--panel-3); color: var(--text); }
.topic-tab.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--text);
}
.topic-tab .tt-name { font-weight: 600; }
.topic-tab .tt-pct { font-size: 10px; color: var(--text-mute); }
.topic-tab.active .tt-pct { color: var(--accent); }

.progress-global { display: flex; flex-direction: column; gap: 6px; }
.pg-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--text-dim);
}
.pg-track {
  height: 6px; background: var(--panel-3);
  border-radius: 99px; overflow: hidden;
}
.pg-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--done), #64d98d);
  border-radius: 99px;
  transition: width .3s ease;
}

.level-nav { display: flex; flex-direction: column; gap: 6px; }

.level-item {
  display: grid;
  grid-template-columns: 10px 1fr;
  align-items: center;
  gap: 9px;
  padding: 10px 11px;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  transition: background .15s, border-color .15s;
}
.level-item:hover { background: var(--panel-2); }
.level-item.active { background: var(--panel-3); border-color: var(--border); }
.level-item.disabled { opacity: .55; cursor: default; }
.level-item.disabled:hover { background: transparent; }

.level-text { display: flex; flex-direction: column; min-width: 0; }
.level-name {
  font-size: 13.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.level-id { font-family: var(--mono); font-size: 12px; color: var(--text-mute); margin-right: 3px; }
.level-meta { font-size: 11px; color: var(--text-mute); }

.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
.dot.done { background: var(--done); }
.dot.doing { background: var(--doing); box-shadow: 0 0 0 3px rgba(245,166,35,.15); }
.dot.todo { background: var(--todo); }

.sidebar-foot {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding-top: 12px;
  display: flex; flex-direction: column; gap: 3px;
}
.hint { font-size: 11.5px; color: var(--text-mute); }
.hint code { font-size: 11px; color: var(--text-dim); }

/* ---------- 主区 ---------- */
.main { padding: 34px 40px 90px; max-width: 1080px; min-width: 0; }
.loading { color: var(--text-mute); }

.page-head { margin-bottom: 26px; }
.page-title { font-size: 26px; font-weight: 700; margin: 0 0 6px; letter-spacing: .2px; }
.page-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 14px; }

.head-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.head-cell {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 13px;
}
.head-cell .k { font-size: 11px; color: var(--text-mute); margin-bottom: 3px; }
.head-cell .v { font-size: 13px; color: var(--text); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--accent-dim);
  color: #9dc0ff;
  border: 1px solid #2b4776;
}

/* ---------- 过滤器 ---------- */
.toolbar {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 0 14px;
  flex-wrap: wrap;
}
.filter-btn {
  font: inherit; font-size: 12.5px;
  padding: 6px 13px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
}
.filter-btn:hover { color: var(--text); border-color: #37404f; }
.filter-btn.active { background: var(--accent-dim); border-color: #2b4776; color: #9dc0ff; }
.toolbar .count { font-size: 12px; color: var(--text-mute); margin-left: auto; }

/* ---------- 模块 ---------- */
.module { margin-bottom: 34px; }
.module-head {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 9px; margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.module-badge {
  font-family: var(--mono); font-size: 12px;
  color: #9dc0ff; background: var(--accent-dim);
  border: 1px solid #2b4776; border-radius: 6px;
  padding: 1px 7px;
}
.module-title { font-size: 17px; font-weight: 650; margin: 0; }
.module-desc { font-size: 12.5px; color: var(--text-mute); margin-left: auto; text-align: right; }

/* ---------- 课程卡片 ---------- */
.lesson {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--todo);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.lesson.done  { border-left-color: var(--done); }
.lesson.doing { border-left-color: var(--doing); }
.lesson.todo  { border-left-color: var(--todo); opacity: .88; }

.lesson-head {
  display: grid;
  grid-template-columns: 52px 1fr auto auto auto;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  cursor: pointer;
  user-select: none;
}
.lesson-head:hover { background: var(--panel-2); }

.lesson-id { font-family: var(--mono); font-size: 12.5px; color: var(--text-mute); }
.lesson-title { font-size: 15px; font-weight: 600; }

.badge {
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 99px;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge.done  { background: var(--done-dim);  color: #7ee2a4; border-color: #205c36; }
.badge.doing { background: var(--doing-dim); color: #f7c164; border-color: #6b4a10; }
.badge.todo  { background: var(--todo-dim);  color: var(--text-mute); border-color: var(--border); }
.badge.w-high { background: #3a1a1a; color: #ff9c9c; border-color: #6b2b2b; }
.badge.w-mid  { background: #2b2618; color: #e0c37a; border-color: #574a24; }
.badge.w-low  { background: var(--todo-dim); color: var(--text-mute); border-color: var(--border); }

.meta { font-size: 11.5px; color: var(--text-mute); white-space: nowrap; }
.meta .actual { color: #7ee2a4; }
.caret { color: var(--text-mute); font-size: 12px; width: 14px; text-align: center; }

.lesson-body {
  padding: 4px 18px 18px 18px;
  border-top: 1px solid var(--border);
  background: var(--panel-2);
}

.section { margin-top: 16px; }
.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .6px;
  color: var(--text-mute);
  text-transform: uppercase;
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 7px;
}
.section-title::before {
  content: ""; width: 3px; height: 12px; border-radius: 2px; background: #37404f;
}
.section.plan .section-title::before   { background: #4f8cff; }
.section.concept .section-title::before{ background: #a78bfa; }
.section.exp .section-title::before    { background: #38bdf8; }
.section.find .section-title::before   { background: #2ecc71; }
.section.pit .section-title::before    { background: #f87171; }
.section.quiz .section-title::before   { background: #f5a623; }
.section.dataset .section-title::before{ background: #2dd4bf; }

.section ul { margin: 0; padding-left: 20px; }
.section li { margin: 3px 0; color: var(--text-dim); font-size: 13.5px; }
.section li strong { color: var(--text); font-weight: 600; }

pre.code {
  background: #0b0d11;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 13px;
  overflow-x: auto;
  font-size: 12.5px;
  line-height: 1.6;
  color: #c8d3e6;
  margin: 8px 0 0;
  white-space: pre;
}

.kv { font-size: 13.5px; color: var(--text-dim); margin: 5px 0; }
.kv b { color: var(--text); font-weight: 600; }

/* ---------------- 实验数据快照（跑之前表里长什么样） ---------------- */
.dtable-block { margin: 10px 0 4px; }
.dtable-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
.dtable-name { font-family: var(--mono); font-size: 13px; color: var(--text); }
.dtable-meta { font-size: 11.5px; color: var(--text-mute); }

.dtable-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0b0d11;
}
table.dtable { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12.5px; }
table.dtable th,
table.dtable td {
  padding: 5px 12px; text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
table.dtable thead th {
  background: var(--panel-3); color: var(--text-mute);
  font-weight: 600; font-size: 11px; letter-spacing: .3px;
}
table.dtable tbody td { color: var(--text-dim); }
table.dtable tbody tr:last-child td { border-bottom: none; }
table.dtable tbody tr:hover td { background: var(--panel-2); }
table.dtable th.focus,
table.dtable td.focus { background: var(--accent-dim); color: var(--text); }

.null { color: #7a8290; font-style: italic; font-size: 11px; letter-spacing: .5px; }

.ddl { margin-top: 7px; }
.ddl summary { cursor: pointer; font-size: 12px; color: var(--text-mute); user-select: none; }
.ddl summary:hover { color: var(--accent); }
.ddl pre.code { margin-top: 6px; }

.qa {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 9px;
}
.qa-q { font-size: 13.5px; color: var(--text-dim); margin-bottom: 2px; }
.qa-q::before { content: "Q "; font-weight: 700; color: #8b93a1; font-family: var(--mono); }

.qa-label {
  font-size: 10.5px;
  letter-spacing: .8px;
  color: var(--text-mute);
  margin: 10px 0 4px;
}
/* 学生原话 —— 最醒目 */
.qa-mine {
  font-size: 14px;
  color: #eef3fb;
  background: #0d1119;
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 9px 12px;
  white-space: pre-wrap;
  line-height: 1.55;
}
.qa-mine.unanswered {
  color: var(--text-mute);
  font-style: italic;
  border-left-color: #39414f;
}
/* 我的纠正 —— 次级 */
.qa-note {
  font-size: 13px;
  color: var(--text-dim);
  background: rgba(245,166,35,.05);
  border-left: 3px solid var(--doing);
  border-radius: 6px;
  padding: 9px 12px;
  white-space: pre-wrap;
}
.qa-note b { color: #f7c164; }

/* 历史问答区块（方向调整前的记录） */
.history-block {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.history-title {
  font-size: 14px;
  font-weight: 650;
  color: var(--text-dim);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--border);
}
.history-block .section { margin-top: 0; }
.history-block .section-title { display: none; }

.empty {
  background: var(--panel);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 26px 22px;
  color: var(--text-mute);
  font-size: 13.5px;
}
.empty h3 { margin: 0 0 8px; font-size: 15px; color: var(--text-dim); font-weight: 600; }

.notice {
  background: var(--doing-dim);
  border: 1px solid #6b4a10;
  border-radius: var(--radius);
  padding: 12px 15px;
  font-size: 13px;
  color: #f0cd8a;
  margin-bottom: 18px;
}

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: static; height: auto; }
  .main { padding: 22px 18px 70px; }
  .lesson-head { grid-template-columns: 44px 1fr auto; }
  .lesson-head .badge.w-high,
  .lesson-head .badge.w-mid,
  .lesson-head .badge.w-low { display: none; }
  /* 窄屏（手机）不要藏时间：只藏「预计」，保留「实测」—— 手机上也要看得到真实进度 */
  .lesson-head .meta .est { display: none; }

  /* 手机上让代码换行而不是横向滚动 —— 横滑看代码体验很差 */
  pre.code { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* 长链接 / 长英文单词也不要把页面撑宽 */
  .kv, .section ul li, .qa-q, .qa-note, .page-sub { overflow-wrap: anywhere; }

  /* 真·小屏：专题标签改成可以横向滑动的一行，别挤成两行 */
  .topic-tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 12px; }
  .topic-tab { flex: 0 0 auto; }

  /* 模块标题栏：窄屏上别让标题和说明抢宽度 —— 说明换到第二行 */
  .module-head { flex-wrap: wrap; }
  .module-desc { margin-left: 0; text-align: left; flex: 0 0 100%; }

  /* 顶部/主区的大留白收紧一点 */
  .sidebar { padding: 18px 14px; }
  .page-head { margin-bottom: 16px; }
}
</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div id="topic-tabs" class="topic-tabs" style="display:none"></div>
      <div class="brand">
        <div class="brand-title" id="brand-title"></div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
      <div id="progress-global" class="progress-global"></div>
      <nav id="level-nav" class="level-nav"></nav>
      <div class="sidebar-foot">
        <div class="hint">单文件 · 离线可用</div>
        <div class="hint">顶部标签切换专题</div>
      </div>
    </aside>
    <main id="main" class="main">
      <div class="loading">正在加载数据…</div>
    </main>
  </div>

<script>
/* =====================================================================
 * 数据区：每个专题一段，形如
 *   window.ROADMAP_DATA = { levels: [] };   ← 先重置
 *   ...plan.js...  ...L0.js... ...L1.js...
 *   window.__TOPICS__.push({ id, name, overview, levels });
 * 最后统一交给 app.js（它认 { topics: [...] } 这种结构）
 * ===================================================================== */
window.__TOPICS__ = [];

/* ===================== 专题：MySQL [Database-Learn] ===================== */
window.ROADMAP_DATA = { levels: [] };
/* =====================================================================
 * plan.js —— 学习路线总览
 * ---------------------------------------------------------------------
 * 【给后续 AI 的交接说明，请先读完这一段再动手】
 *
 * 1. 本看板是"数据 / 呈现"分离的：
 *      - roadmap/data/*.js  → 只放数据（本文件 + L0.js + L1.js + 以后每个层级一个）
 *      - roadmap/index.html / style.css / app.js → 只负责呈现，改数据不用动它们
 *
 * 2. 新会话开始时：
 *      a. 先读工作区根目录的 `MySQL学习指导.md`（用户自己写的教学规则，必须遵守）
 *      b. 再读 `roadmap/README.md`（数据格式约定）
 *      c. 再读 `roadmap/data/L1.js`，找 status 为 "doing" 的课，从那里继续
 *
 * 3. 每讲完一节课，请更新对应的课：
 *      - status: 'todo' → 'doing' → 'done'
 *      - findings: 追加"学到的结论"（一句话一条）
 *      - quiz: 追加"我问了什么 + 学生怎么答的 + 纠正了什么"
 *      - pitfalls: 追加学生踩过的坑
 *      - experiment.file: 对应 labNN.sql
 *
 * 4. 开新层级时：复制 L1.js 的结构新建 L2.js，然后在下面 levels 里加一行。
 *    注意：开新层级前要**先把这个层级的全部课程规划写进数据文件**，
 *    这样用户可以开一个干净的会话从头学，不会因为上下文超限而丢掉规划。
 * ===================================================================== */

window.ROADMAP_DATA = window.ROADMAP_DATA || {};

window.ROADMAP_DATA.overview = {
  title: 'MySQL 面试学习看板',
  subtitle: '目标：国内 Java 后端开发岗 · 每个知识点都用实验验证',
  workspace: '/Users/dingyujie/数据/Code/Learn/Database-Learn',

  // 学生档案（新会话的 AI 请据此调整讲解深度）
  student: {
    background: '对日开发初级工程师，准备跳槽国内 Java 后端岗；macOS + VS Code；练习项目 Spring Boot 4.1.1 + Java 21',
    level: '会基本 CRUD；索引 / EXPLAIN / 事务与锁 / SQL 优化 / 存储引擎 完全不懂',
    strength: '学过红黑树、AVL 树和高等数学，有能力理解 B+ 树等底层原理',
    weakness: '习惯"先看懂再动手"，需要被推着先动手；易拼错标识符；会把 NULL 和 空字符串 / 0 混为一谈',
    rulesFile: 'MySQL学习指导.md'
  },

  // 层级总览。每加一个层级，在这里加一行，并在 data/ 下建对应的 js 文件。
  levels: [
    {
      id: 'L0',
      file: 'data/L0.js',
      title: 'Docker 环境基础（前置）',
      status: 'done',
      meta: '4 节 · 已完成',
      summary: '镜像/容器/卷/端口映射、compose 解读、docker exec 与退出码。数据库还没开始，先把环境跑通。'
    },
    {
      id: 'L1',
      file: 'data/L1.js',
      title: 'SQL 语言基础',
      status: 'doing',
      meta: '15 节 · 进行中',
      summary: '查询的执行骨架、聚合与集合、多表、窗口函数、写操作。目标是能独立写出面试常见手撕题。'
    },
    {
      id: 'L2',
      file: null,
      title: '表设计 / 范式',

    items: [

          '网上很多教程基于 Boot 2.x，配置项可能不同 —— 遇到不确定的先查版本。'
  },

  modules: [
    {

      lessons: [
        {

          weight: '高',
          estimate: '40 min',
          plan: '引入 starter、配置连接、理解自动配置做了什么。' +
                '重点搞清 RedisTemplate 和 StringRedisTemplate 的区别，' +

          concepts: [],

        },
        {

          plan: 'RedisTemplate 默认用 JDK 序列化，所以用 redis-cli 看到的是乱码、体积也大。' +
                '搞清 KeySerializer / ValueSerializer / HashKeySerializer / HashValueSerializer 四个配置各管什么，' +

        {

          plan: '@Cacheable / @CachePut / @CacheEvict 的用法，怎么配 TTL（默认永不过期，很危险），' +
                '以及三个经典坑：' +
                '① 同类内部调用不生效（本质是代理，和 @Transactional 失效是同一个原因）；' +
                '② 缓存 null 值的行为；' +

                '这节正好把"Spring 原理"和"Redis 缓存实战"连起来。',
          concepts: [],

});
window.__TOPICS__.push({ id: 'Redis-Learn', name: 'Redis', overview: window.ROADMAP_DATA.overview, levels: window.ROADMAP_DATA.levels });

window.ROADMAP_DATA = { siteTitle: 'learn-board', topics: window.__TOPICS__ };

<script>
/* =====================================================================
 * app.js —— 呈现逻辑（与数据无关）
 * ---------------------------------------------------------------------
 * 数据来源：window.ROADMAP_DATA
 *   - .overview           来自 data/plan.js（标题 + 层级清单 + 学生档案）
 *   - .levels[]           来自 data/L0.js、data/L1.js …（每层一个文件）
 *
 * plan.js 里 levels[].file 指向该层的数据文件，本文件会按顺序动态加载。
 * 新增一个层级 = 新建 data/L2.js + 在 plan.js 的 levels 里加一行，不用改这里。
 *
 * ⭐ 本文件是**所有专题仓库共用的同一个文件**（Database-Learn / Redis-Learn /
 *    Java-Basic-Learn …）。复制到新专题时**不需要改任何东西** ——
 *    标题、层级、内容全部从 data/*.js 读。
 *
 * 为了能共用，下面这些字段同时支持"新旧两种写法"：
 *   - 实验代码：experiment.code（新）或 experiment.sql（旧）
 *   - 环境块：  environment.items 数组（新）或 environment 固定字段（旧）
 *   - lesson.bytecode 和 lesson.metrics 只有部分专题用，没有就不渲染
 *
 * 同时支持两种**运行模式**：
 *   - 单专题（每个专题仓库自己用）：
 *       window.ROADMAP_DATA = { overview, levels }
 *     这时 side bar 顶部不显示专题切换栏。
 *   - 多专题（打包成单个 HTML 文件时用，见 build-board.sh）：
 *       window.ROADMAP_DATA = { topics: [ {id, name, overview, levels}, ... ] }
 *     这时 sidebar 顶部会出现一排专题标签，点击切换。
 * ===================================================================== */

(function () {
  'use strict';

  var ROOT = window.ROADMAP_DATA || {};

  /* 把两种模式统一成 topics 数组 */
  function normalizeTopics() {
    if (ROOT.topics && ROOT.topics.length) {
      return ROOT.topics.map(function (t, i) {
        return {
          id: t.id || ('t' + i),
          name: t.name || (t.overview && t.overview.title) || ('专题' + (i + 1)),
          overview: t.overview || { levels: [] },
          levels: t.levels || []
        };
      });
    }
    if (ROOT.overview) {
      return [{
        id: 'single',
        name: ROOT.overview.title || '学习看板',
        overview: ROOT.overview,
        levels: ROOT.levels || []
      }];
    }
    return [];
  }

  var TOPICS = normalizeTopics();
  var IS_MERGED = !!(ROOT.topics && ROOT.topics.length);   // 打包成单文件时 = true

  /* 站点标题：合并版由 build-board.sh 写死（如 'learn-board'），
     它决定浏览器标签页和手机「添加到主屏幕」后的图标名。
     单专题模式下为 null，就退回去用当前专题的 title。 */
  var SITE_TITLE = ROOT.siteTitle || null;
  function titleOfTopic(t) {
    return SITE_TITLE || (t && t.overview && t.overview.title) || '学习看板';
  }

  var state = {
    topicIndex: 0,
    levelId: null,
    filter: 'all',   // all | done | doing | todo
    open: {}         // lessonId -> true
  };

  var STATUS_TEXT = { done: '已完成', doing: '进行中', todo: '未开始' };

  function curTopic() {
    return TOPICS[state.topicIndex] || { overview: { levels: [] }, levels: [] };
  }
  function curOverview() {
    return curTopic().overview || { levels: [] };
  }

  /* ---------------- 工具 ---------------- */

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* 行内 markdown：先转义 HTML，再把 **粗体** 和 `代码` 转成标签。
     数据文件里可以直接写 **重点**，看板上会真正加粗。 */
  function mdInline(v) {
    var s = esc(v);
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    return s;
  }

  function weightClass(w) {
    if (w === '高') return 'w-high';
    if (w === '中') return 'w-mid';
    return 'w-low';
  }

  function findLevelData(id) {
    var list = curTopic().levels || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  function flattenLessons(level) {
    var out = [];
    (level.modules || []).forEach(function (m) {
      (m.lessons || []).forEach(function (l) { out.push(l); });
    });
    return out;
  }

  function progressOf(level) {
    var all = flattenLessons(level);
    return {
      total: all.length,
      done: all.filter(function (l) { return l.status === 'done'; }).length,
      doing: all.filter(function (l) { return l.status === 'doing'; }).length,
      todo: all.filter(function (l) { return l.status === 'todo'; }).length
    };
  }

  /* ---------------- 数据加载 ---------------- */

  function loadScript(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () {
        window.console.warn('[roadmap] 数据文件加载失败：' + src);
        resolve();
      };
      document.head.appendChild(s);
    });
  }

  function loadAll() {
    // 打包成单个 HTML 时，所有数据已经内联在文件里了，不需要（也加载不到）外部文件
    if (IS_MERGED) return Promise.resolve();

    var files = (curOverview().levels || [])
      .map(function (l) { return l.file; })
      .filter(Boolean);
    if (!files.length) return Promise.resolve();
    return files.reduce(function (p, f) {
      return p.then(function () { return loadScript(f); });
    }, Promise.resolve());
  }

  /* ---------------- 侧栏 ---------------- */

  function renderSidebar() {
    var ov = curOverview();
    document.getElementById('brand-sub').textContent = ov.subtitle || '';

    var totalLessons = 0, totalDone = 0;
    (ov.levels || []).forEach(function (meta) {
      var d = findLevelData(meta.id);
      if (!d) return;
      var p = progressOf(d);
      totalLessons += p.total;
      totalDone += p.done;
    });

    var pct = totalLessons ? Math.round(totalDone / totalLessons * 100) : 0;
    document.getElementById('progress-global').innerHTML =
      '<div class="pg-label"><span>总体进度</span><span>' +
      totalDone + ' / ' + totalLessons + ' 节 · ' + pct + '%</span></div>' +
      '<div class="pg-track"><div class="pg-fill" style="width:' + pct + '%"></div></div>';

    var nav = document.getElementById('level-nav');
    nav.innerHTML = (ov.levels || []).map(function (meta) {
      var d = findLevelData(meta.id);
      var p = d ? progressOf(d) : null;
      var metaText = p ? (p.done + '/' + p.total + ' 节') : (meta.meta || '未规划');
      var cls = 'level-item' + (state.levelId === meta.id ? ' active' : '') +
                (d ? '' : ' disabled');
      return '<button class="' + cls + '" data-level="' + esc(meta.id) + '">' +
        '<span class="dot ' + esc(meta.status || 'todo') + '"></span>' +
        '<span class="level-text">' +
        '<span class="level-name"><span class="level-id">' + esc(meta.id) + '</span>' +
        esc(meta.title) + '</span>' +
        '<span class="level-meta">' + esc(metaText) + '</span>' +
        '</span>' +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(nav.querySelectorAll('.level-item'), function (btn) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('disabled')) return;
        state.levelId = btn.getAttribute('data-level');
        state.filter = 'all';
        renderSidebar();
        renderMain();
      });
    });
  }

  /* ---------------- 课程卡片 ---------------- */

  function renderList(title, items, cls) {
    if (!items || !items.length) return '';
    return '<div class="section ' + cls + '">' +
      '<div class="section-title">' + esc(title) + '</div><ul>' +
      items.map(function (t) { return '<li>' + mdInline(t) + '</li>'; }).join('') +
      '</ul></div>';
  }

  /* 速查：Redis 里是命令，Java 里是 API / 命令行，渲染成代码块 */
  function renderCheatsheet(cs) {
    if (!cs) return '';
    var items = Array.isArray(cs) ? cs : (cs.items || []);
    if (!items.length && !cs.title) return '';
    return '<div class="section cheat">' +
      '<div class="section-title">' + esc((cs && cs.title) || '速查') + '</div>' +
      '<pre class="code">' + esc(items.join('\n')) + '</pre></div>';
  }

  /* 🆕 字节码观察：Java 基础专用 */
  function renderBytecode(bc) {
    if (!bc) return '';
    var body = '';
    if (bc.cmd) {
      body += '<div class="kv"><b>怎么看：</b><code>' + esc(bc.cmd) + '</code></div>';
    }
    if (bc.out && bc.out.length) {
      body += '<pre class="code">' + esc(bc.out.join('\n')) + '</pre>';
    }
    if (bc.what) {
      body += '<div class="kv"><b>要看什么：</b>' + mdInline(bc.what) + '</div>';
    }
    if (!body) {
      body = '<div class="kv" style="color:var(--text-mute)">字节码观察待补。</div>';
    }
    return '<div class="section bytecode"><div class="section-title">字节码观察</div>' +
      body + '</div>';
  }

  /* 🆕 实验数据快照 —— 跑实验之前，表里到底长什么样
     为什么需要它：复习时只看到 SQL 和结果，不知道当时表里是什么数据，
     根本对不上号（"为什么 WHERE bonus <> 2000 只返回 Carol？"）。

     lesson.dataset = {
       label: '实验开始前的数据',   // 可选，默认「实验数据」
       note:  '一句话补充',          // 可选
       tables: [
         {
           name: 'employees',        // 表名
           columns: ['id', 'name'],  // 列名（表头）
           rows: [[1, 'Alice'], ...],// 每行用数组按 columns 的顺序填
           focus: ['bonus'],         // 可选：本节重点关注的列，会高亮
           note:  'bonus 是本次新加的列',  // 可选
           ddl:   'CREATE TABLE ...' // 可选，折叠在「建表语句」里
         }
       ]
     }
     值写 null 会渲染成灰色的 NULL，别写成 'NULL' 字符串（那样看不出真假）。 */
  function renderCell(v) {
    if (v === null || v === undefined) return '<span class="null">NULL</span>';
    if (v === true) return 'TRUE';
    if (v === false) return 'FALSE';
    return esc(v);
  }

  function renderDataTable(tb) {
    if (!tb || !tb.columns || !tb.columns.length) return '';
    var focus = tb.focus || [];
    var cls = function (c) { return focus.indexOf(c) >= 0 ? ' class="focus"' : ''; };

    var head = '<tr>' + tb.columns.map(function (c) {
      return '<th' + cls(c) + '>' + esc(c) + '</th>';
    }).join('') + '</tr>';

    var body = (tb.rows || []).map(function (r) {
      return '<tr>' + tb.columns.map(function (c, i) {
        return '<td' + cls(c) + '>' + renderCell(r[i]) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    var html = '<div class="dtable-block">';
    html += '<div class="dtable-head"><span class="dtable-name">' + esc(tb.name) + '</span>' +
      '<span class="dtable-meta">' + tb.columns.length + ' 列 × ' +
      (tb.rows || []).length + ' 行</span></div>';
    if (tb.note) html += '<div class="kv">' + mdInline(tb.note) + '</div>';
    html += '<div class="dtable-wrap"><table class="dtable">' +
      '<thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    if (tb.ddl) {
      html += '<details class="ddl"><summary>建表语句</summary>' +
        '<pre class="code">' + esc(tb.ddl) + '</pre></details>';
    }
    return html + '</div>';
  }

  function renderDataset(ds) {
    if (!ds || !ds.tables || !ds.tables.length) return '';
    var inner = ds.tables.map(renderDataTable).join('');
    if (ds.note) {
      inner += '<div class="kv" style="color:var(--text-mute)">' + mdInline(ds.note) + '</div>';
    }
    return '<div class="section dataset"><div class="section-title">' +
      esc(ds.label || '实验数据（跑之前，表里长这样）') + '</div>' + inner + '</div>';
  }

  function renderExperiment(exp) {
    if (!exp) return '';
    var body = '';
    if (exp.file) {
      body += '<div class="kv"><b>实验文件：</b><span class="mono">' + esc(exp.file) + '</span></div>';
    }
    // 兼容新旧两种写法：experiment.code（新）或 experiment.sql（旧，MySQL 版早期数据）
    var codeLines = exp.code || exp.sql || [];
    var codeLabel = exp.label || (exp.sql && !exp.code ? 'SQL' : null);
    if (codeLines.length) {
      if (codeLabel) {
        body += '<div class="kv"><b>' + esc(codeLabel) + '</b></div>';
      }
      body += '<pre class="code">' + esc(codeLines.join('\n')) + '</pre>';
    }
    if (exp.expected) {
      body += '<div class="kv"><b>预期看到什么：</b>' + mdInline(exp.expected) + '</div>';
    }
    if (exp.errors) {
      body += '<div class="kv"><b>如果不一样，说明什么：</b>' + mdInline(exp.errors) + '</div>';
    }
    if (exp.evidence) {
      body += '<div class="kv"><b>实验证据：</b>' + mdInline(exp.evidence) + '</div>';
    }
    if (exp.note) {
      body += '<div class="kv" style="color:var(--text-mute)"><b>备注：</b>' + mdInline(exp.note) + '</div>';
    }
    if (!body) {
      body = '<div class="kv" style="color:var(--text-mute)">实验待设计 —— 学到这一节时再补。</div>';
    }
    return '<div class="section exp"><div class="section-title">动手实验</div>' + body + '</div>';
  }

  /* 数值记录：有数字的结论（内存占用 / 耗时 / 循环次数） */
  function renderMetrics(metrics) {
    if (!metrics || !metrics.length) return '';
    return '<div class="section"><div class="section-title">数值记录</div>' +
      '<ul>' + metrics.map(function (m) { return '<li>' + mdInline(m) + '</li>'; }).join('') +
      '</ul></div>';
  }

  /* 问答记录：只放学生真实的回答（原句），我的解释单独放 note */
  function renderQuiz(quiz) {
    if (!quiz || !quiz.length) return '';
    return '<div class="section quiz"><div class="section-title">问答记录</div>' +
      quiz.map(function (item) {
        return '<div class="qa">' +
          '<div class="qa-q">' + mdInline(item.q) + '</div>' +
          '<div class="qa-label">我当时的回答</div>' +
          (item.mine
            ? '<div class="qa-mine">' + esc(item.mine) + '</div>'
            : '<div class="qa-mine unanswered">（未回答）</div>') +
          (item.note
            ? '<div class="qa-label">讲解 / 纠正</div>' +
              '<div class="qa-note">' + mdInline(item.note) + '</div>'
            : '') +
          '</div>';
      }).join('') + '</div>';
  }

  /* 历史问答：方向调整前的记录，单独渲染在页面底部 */
  function renderHistory(level) {
    if (!level.history || !level.history.length) return '';
    return level.history.map(function (block) {
      return '<div class="history-block">' +
        '<div class="history-title">' + esc(block.title) + '</div>' +
        renderQuiz(block.quiz) +
        '</div>';
    }).join('');
  }

  function renderLesson(lesson) {
    var st = lesson.status || 'todo';
    var open = !!state.open[lesson.id];

    var head = '<div class="lesson-head" data-toggle="' + esc(lesson.id) + '">' +
      '<span class="lesson-id">' + esc(lesson.id) + '</span>' +
      '<span class="lesson-title">' + esc(lesson.title) + '</span>' +
      (lesson.weight
        ? '<span class="badge ' + weightClass(lesson.weight) + '">面试权重 ' + esc(lesson.weight) + '</span>'
        : '<span></span>') +
      '<span class="badge ' + esc(st) + '">' + esc(STATUS_TEXT[st] || st) + '</span>' +
      '<span class="meta"><span class="est">' + esc(lesson.estimate || '') + '</span>' +
        (lesson.actual ? ' <span class="actual">实测 ' + esc(lesson.actual) + '</span>' : '') +
        '　' + (open ? '▾' : '▸') + '</span>' +
      '</div>';

    if (!open) return '<div class="lesson ' + esc(st) + '">' + head + '</div>';

    var body = '';
    if (lesson.plan) {
      body += '<div class="section plan"><div class="section-title">这节课要解决什么</div>' +
        '<div class="kv">' + mdInline(lesson.plan) + '</div></div>';
    }
    body += renderList('新概念', lesson.concepts, 'concept');
    body += renderCheatsheet(lesson.cheatsheet);
    body += renderDataset(lesson.dataset);
    body += renderExperiment(lesson.experiment);
    body += renderBytecode(lesson.bytecode);
    body += renderList('学到的结论', lesson.findings, 'find');
    body += renderMetrics(lesson.metrics);
    body += renderList('踩过的坑', lesson.pitfalls, 'pit');
    body += renderQuiz(lesson.quiz);

    return '<div class="lesson ' + esc(st) + '">' + head +
      '<div class="lesson-body">' + body + '</div></div>';
  }

  function renderModule(mod) {
    var lessons = (mod.lessons || []).filter(function (l) {
      return state.filter === 'all' || l.status === state.filter;
    });
    if (!lessons.length) return '';
    return '<section class="module">' +
      '<div class="module-head">' +
      '<span class="module-badge">' + esc(mod.id) + '</span>' +
      '<h2 class="module-title">' + esc(mod.title) + '</h2>' +
      (mod.desc ? '<div class="module-desc">' + esc(mod.desc) + '</div>' : '') +
      '</div>' +
      lessons.map(renderLesson).join('') +
      '</section>';
  }

  /* ---------------- 主区 ---------------- */

  /* 环境块：兼容两种写法
     - 新：environment.items 数组（每个专题的字段不一样）
     - 旧：environment 固定字段（MySQL 版早期的 container/version/database/charset/...） */
  function renderEnvironment(env) {
    var e = env;
    if (!e) return '';

    if (e.items && e.items.length) {
      var html = '<div class="notice"><b>' + esc(e.title || '环境') + '</b><br>' +
        e.items.map(function (row) {
          return '<div class="kv">' + esc(row[0]) + '：<code>' + esc(row[1]) + '</code></div>';
        }).join('');
      if (e.note) {
        html += '<div class="kv" style="color:var(--text-mute)">' + mdInline(e.note) + '</div>';
      }
      return html + '</div>';
    }

    // 旧格式
    var parts = [];
    if (e.container) parts.push(esc(e.container));
    if (e.version) parts.push(esc(e.version));
    if (e.database) parts.push('库 <code>' + esc(e.database) + '</code>');
    if (e.charset) parts.push(esc(e.charset));
    var old = '<div class="notice"><b>环境</b>　' + parts.join(' · ') + '<br>';
    if (e.connect) old += '连接：<code>' + esc(e.connect) + '</code><br>';
    if (e.runLabFile) old += '跑实验文件：<code>' + esc(e.runLabFile) + '</code>';
    if (e.note) old += '<br><span style="color:var(--text-mute)">' + mdInline(e.note) + '</span>';
    return old + '</div>';
  }

  function renderMain() {
    var main = document.getElementById('main');
    var level = findLevelData(state.levelId);
    var meta = (curOverview().levels || []).filter(function (m) { return m.id === state.levelId; })[0] || {};

    if (!level) {
      main.innerHTML =
        '<div class="page-head"><h1 class="page-title">' + esc(meta.title || state.levelId) + '</h1>' +
        '<div class="page-sub">' + esc(meta.summary || '') + '</div></div>' +
        '<div class="empty"><h3>这个层级还没有建规划文件</h3>' +
        '开始学这一层之前，先复制 <code>data/L1.js</code> 的结构建一个 <code>data/' +
        esc(state.levelId) + '.js</code>，把整层的课程大纲写进去，' +
        '然后在 <code>data/plan.js</code> 的 <code>levels</code> 里把 <code>file</code> 填上。<br><br>' +
        '这样做的原因：把规划提前写进文件，你就可以开一个干净的会话从头学，' +
        '不用怕上下文超限丢掉计划。</div>';
      return;
    }

    var p = progressOf(level);

    var html = '<div class="page-head">' +
      '<h1 class="page-title">' + esc(level.id) + ' · ' + esc(level.title) + '</h1>' +
      '<div class="page-sub">' + mdInline(level.subtitle || '') + '</div>' +
      '<div class="head-grid">' +
      '<div class="head-cell"><div class="k">目标</div><div class="v">' + mdInline(level.goal || '') + '</div></div>' +
      '<div class="head-cell"><div class="k">规模</div><div class="v">' + esc(level.estimate || '') + '</div></div>' +
      '<div class="head-cell"><div class="k">进度</div><div class="v">已完成 ' + p.done +
      ' · 进行中 ' + p.doing + ' · 未开始 ' + p.todo + '</div></div>' +
      '</div>';

    if (level.interviewRefs && level.interviewRefs.length) {
      html += '<div class="tags">' + level.interviewRefs.map(function (t) {
        return '<span class="tag">' + mdInline(t) + '</span>';
      }).join('') + '</div>';
    }
    html += '</div>';

    if (level.environment) {
      html += renderEnvironment(level.environment);
    }

    var counts = { all: p.total, done: p.done, doing: p.doing, todo: p.todo };
    html += '<div class="toolbar">' +
      ['all', 'done', 'doing', 'todo'].map(function (f) {
        var label = { all: '全部', done: '已完成', doing: '进行中', todo: '未开始' }[f];
        return '<button class="filter-btn' + (state.filter === f ? ' active' : '') +
          '" data-filter="' + f + '">' + label + ' (' + counts[f] + ')</button>';
      }).join('') +
      '<span class="count">点课程标题展开详情</span></div>';

    html += (level.modules || []).map(renderModule).join('');
    html += renderHistory(level);

    main.innerHTML = html;

    Array.prototype.forEach.call(main.querySelectorAll('.filter-btn'), function (btn) {
      btn.addEventListener('click', function () {
        state.filter = btn.getAttribute('data-filter');
        renderMain();
      });
    });

    Array.prototype.forEach.call(main.querySelectorAll('[data-toggle]'), function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-toggle');
        state.open[id] = !state.open[id];
        renderMain();
      });
    });
  }

  /* ---------------- 专题切换（只在打包版显示） ---------------- */

  function renderTopicTabs() {
    var host = document.getElementById('topic-tabs');
    if (!host) return;
    if (TOPICS.length <= 1) { host.innerHTML = ''; host.style.display = 'none'; return; }
    host.style.display = '';
    host.innerHTML = TOPICS.map(function (t, i) {
      var lv = t.levels || [];
      var all = 0, done = 0;
      lv.forEach(function (l) { var p = progressOf(l); all += p.total; done += p.done; });
      var pct = all ? Math.round(done / all * 100) : 0;
      return '<button class="topic-tab' + (i === state.topicIndex ? ' active' : '') +
        '" data-topic="' + i + '">' +
        '<span class="tt-name">' + esc(t.name) + '</span>' +
        '<span class="tt-pct">' + pct + '%</span>' +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(host.querySelectorAll('.topic-tab'), function (btn) {
      btn.addEventListener('click', function () {
        var i = parseInt(btn.getAttribute('data-topic'), 10);
        if (i === state.topicIndex) return;
        switchTopic(i);
      });
    });
  }

  function switchTopic(i) {
    state.topicIndex = i;
    state.filter = 'all';
    state.open = {};
    var ov = curOverview();
    var preferred = (ov.levels || []).filter(function (l) { return l.status === 'doing'; })[0]
      || (ov.levels || [])[0];
    state.levelId = preferred ? preferred.id : null;
    flattenLessonsOfTopic(i).forEach(function (l) {
      if (l.status === 'doing') state.open[l.id] = true;
    });
    var t = TOPICS[i];
    document.title = titleOfTopic(t);
    var bt = document.getElementById('brand-title');
    if (bt) bt.textContent = document.title;
    renderTopicTabs();
    renderSidebar();
    renderMain();
    window.scrollTo(0, 0);
  }

  function flattenLessonsOfTopic(i) {
    var out = [];
    ((TOPICS[i] || {}).levels || []).forEach(function (lv) {
      flattenLessons(lv).forEach(function (l) { out.push(l); });
    });
    return out;
  }

  /* ---------------- 启动 ---------------- */

  function boot() {
    var title = titleOfTopic(TOPICS[state.topicIndex]);
    document.title = title;
    var bt = document.getElementById('brand-title');
    if (bt) bt.textContent = title;

    loadAll().then(function () {
      /* ⚠️ 必须在这里重新算一次 TOPICS：
         各层级的 data/LN.js 是上面 loadAll() 里**动态**加进来的，而 TOPICS 是在
         本文件被浏览器执行的那一刻就算好的 —— 那时 window.ROADMAP_DATA.levels
         还不存在，normalizeTopics() 算出来的 levels 是个空数组。
         不重算的话，单专题模式下整个看板会一个层级都显示不出来（只显示总进度 0/0）。
         打包版（多专题）没这个问题，因为数据是内联在 app.js 之前的。 */
      TOPICS = normalizeTopics();

      var ov = curOverview();
      var preferred = (ov.levels || []).filter(function (l) { return l.status === 'doing'; })[0]
        || (ov.levels || [])[0];
      state.levelId = preferred ? preferred.id : null;

      flattenLessonsOfTopic(state.topicIndex).forEach(function (l) {
        if (l.status === 'doing') state.open[l.id] = true;
      });
      renderTopicTabs();
      renderSidebar();
      renderMain();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
